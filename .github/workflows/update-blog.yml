name: Update Blog Posts

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  update-blog:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Blogger feed
        run: |
          curl -fL --retry 3 \
            "https://dorislittlenotes.blogspot.com/feeds/posts/default?alt=json&max-results=50" \
            -o blogger.json

      - name: Generate public/posts.json
        run: |
          python3 <<'PY'
          import json
          import html
          import re
          from pathlib import Path

          with open("blogger.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          entries = data.get("feed", {}).get("entry", [])
          posts = []

          def prepare_blogger_html(content):
              # Keep Blogger's complete article HTML, including images.
              # Remove executable content before publishing it.
              content = re.sub(
                  r"<script.*?</script>",
                  "",
                  content,
                  flags=re.DOTALL | re.IGNORECASE,
              )

              # Blogger image URLs often contain /s320/, /s640/, /s706/,
              # etc. Request a larger version while keeping the same image.
              content = re.sub(
                  r"(https?://blogger\.googleusercontent\.com/[^\"'\s>]+?)/s\d+(?:-c)?/",
                  r"\1/s1600/",
                  content,
                  flags=re.IGNORECASE,
              )

              # Handle Blogger URLs that appear HTML-escaped as https:\/\/...
              content = re.sub(
                  r"(https?:\\/\\/blogger\.googleusercontent\.com/[^\"'\s>]+?)/s\d+(?:-c)?/",
                  r"\1/s1600/",
                  content,
                  flags=re.IGNORECASE,
              )

              # Promote data-src to src if a Blogger image uses lazy-loading
              # markup that would otherwise leave the image unloaded.
              def promote_data_src(match):
                  tag = match.group(0)
                  if re.search(r"\bsrc\s*=", tag, re.IGNORECASE):
                      return tag
                  data_src = re.search(
                      r"\bdata-src\s*=\s*([\"'])(.*?)\1",
                      tag,
                      re.IGNORECASE | re.DOTALL,
                  )
                  if not data_src:
                      return tag
                  url = data_src.group(2)
                  return re.sub(
                      r"(<img\b)",
                      r'\1 src="' + url.replace('"', '&quot;') + '"',
                      tag,
                      count=1,
                      flags=re.IGNORECASE,
                  )

              content = re.sub(
                  r"<img\b[^>]*>",
                  promote_data_src,
                  content,
                  flags=re.IGNORECASE,
              )

              # Keep images responsive and let the browser load them normally.
              def prepare_img(match):
                  tag = match.group(0)
                  if not re.search(r"\bloading\s*=", tag, re.IGNORECASE):
                      tag = tag[:-1] + ' loading="lazy">'
                  if not re.search(r"\bdecoding\s*=", tag, re.IGNORECASE):
                      tag = tag[:-1] + ' decoding="async">'
                  return tag

              return re.sub(
                  r"<img\b[^>]*>",
                  prepare_img,
                  content,
                  flags=re.IGNORECASE,
              )

          for entry in entries:
              title = entry.get("title", {}).get("$t", "Untitled")
              post_id = entry.get("id", {}).get("$t", "").split(".post-")[-1]
              published = entry.get("published", {}).get("$t", "")

              content = entry.get("content", entry.get("summary", {})).get("$t", "")
              clean_content = prepare_blogger_html(content)

              # Generate excerpt from text, but keep the complete HTML in
              # content so Blogger images and formatting are preserved.
              text = re.sub(r"<[^>]+>", " ", clean_content)
              text = html.unescape(text)
              text = re.sub(r"\s+", " ", text).strip()

              excerpt = text[:280]
              if len(text) > 280:
                  excerpt += "..."

              posts.append({
                  "id": post_id,
                  "title": title,
                  "date": published,
                  "excerpt": excerpt,
                  "content": clean_content,
              })

          output = Path("public/posts.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(posts, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Commit updated posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/posts.json
          if git diff --cached --quiet; then
            echo "No new Blogger posts or changes."
          else
            git commit -m "Update blog posts from Blogger"
            git push
          fi
