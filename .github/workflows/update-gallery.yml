name: Update Gallery Data

on:
  workflow_dispatch:
  push:
    paths:
      - "public/gallery/**"
      - ".github/workflows/update-gallery.yml"

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate gallery.json
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          gallery_dir = Path("public/gallery")
          output = Path("public/gallery.json")
          image_extensions = {".jpg", ".jpeg", ".png", ".webp", ".gif", ".avif"}

          images = []
          if gallery_dir.exists():
              for path in sorted(gallery_dir.iterdir(), key=lambda p: p.name.lower()):
                  if path.is_file() and path.suffix.lower() in image_extensions:
                      images.append({
                          "filename": path.name,
                          "src": f"gallery/{path.name}"
                      })

          output.write_text(
              json.dumps(images, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print(f"Generated gallery.json with {len(images)} images.")
          PY

      - name: Commit updated gallery data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/gallery.json
          if git diff --cached --quiet; then
            echo "No gallery changes."
          else
            git commit -m "Update gallery data"
            git push
          fi
